<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Booking for {{competition['name']}} || GUDLFT</title>
</head>
<body>
    <h2>{{competition['name']}}</h2>
    Places available: {{competition['numberOfPlaces']}}
    <p>Your club points: {{ club['points'] }}</p>
    {% if already_booked > 0 %}
    <p>Already booked for this competition: {{ already_booked }}</p>
    {% endif %}
    <p>You can book up to <strong>{{ max_places }}</strong> place(s) for this competition.</p>
    <form action="/purchasePlaces" method="post">
        <input type="hidden" name="club" value="{{club['name']}}">
        <input type="hidden" name="competition" value="{{competition['name']}}">
        <label for="places">How many places?</label>
        <input type="number" name="places" id="places" min="1" max="{{ max_places }}" required/>
        <button type="submit">Book</button>
    </form>
</body>
</html>
